    <style>
        /* 全体のスタイル（和モダン・シック） */
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: #fcfbfa; /* 落ち着いた和紙のような白 */
            color: #2c3e50; /* 深みのある紺・墨色 */
            margin: 0;
            padding: 0;
            line-height: 1.8;
            letter-spacing: 0.05em;
        }

        /* ページ全体を開いた時にふわっと浮かび上がらせる設定 */
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            padding-bottom: 40px;
            
            opacity: 0;
            transform: translateY(20px);
            animation: pageFadeIn 1.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes pageFadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 写真エリアの初期設定（スクロール用） */
        .hero, .sub-photo {
            position: relative;
            width: 100%;
            height: 450px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            opacity: 0;
            transform: translateY(40px) scale(1.05);
            transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1), opacity 1.2s cubic-bezier(0.25, 1, 0.5, 1);
        }
        
        .sub-photo {
            height: 350px; 
            margin: 20px 0;
        }

        .hero.is-visible, .sub-photo.is-visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .hero img, .sub-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .hero-overlay, .photo-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(44, 62, 80, 0.15);
        }

        /* タイトル・挨拶 */
        .section {
            padding: 40px 30px;
            text-align: center;
        }
        .accent-line {
            width: 40px;
            height: 2px;
            background-color: #9e2a2b;
            margin: 20px auto;
        }
        .section p {
            font-size: 15px;
            color: #555;
            text-align: center;
            margin: 0 auto;
        }

        /* 情報・日時 */
        .info-box {
            background-color: #f7f5f0;
            border: 1px solid #eadecc;
            padding: 30px 20px;
            margin: 20px;
            border-radius: 4px;
        }
        .info-title {
            font-weight: bold;
            color: #9e2a2b;
            margin-top: 15px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        .info-value {
            font-size: 16px;
            margin-bottom: 15px;
        }

        /* フォームエリア */
        .form-section {
            background-color: #ffffff;
            margin: 40px 20px 0;
            padding: 30px 20px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
        }
        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
            background-color: #fafafa;
        }
        input[type="text"]:focus, textarea:focus {
            border-color: #9e2a2b;
            outline: none;
            background-color: #fff;
        }
        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }
